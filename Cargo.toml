[package]
name = "review-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Operator tooling for AI reviews of GitHub pull requests"

[dependencies]
anyhow = "1"
axum = "0.8.9"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
include_dir = "0.7.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6.1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54.1", features = ["net", "rt", "time"] }
ureq = { version = "3.5.0", features = ["platform-verifier"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1.5", features = ["fs", "process"] }
signal-hook = "0.3.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_WindowsProgramming"] }
