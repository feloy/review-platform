[package]
name = "review-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Operator tooling for AI reviews of GitHub pull requests"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
ureq = "3.5.0"
